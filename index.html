<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carte des projets en cours du BIMO</title>
  <meta name="description" content="Carte interactive des projets en cours et finis du BIMO." />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="anonymous" />

  <link rel="preload" href="assets/fonts/Marianne-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/Marianne-Bold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/Marianne-ExtraBold.woff2" as="font" type="font/woff2" crossorigin />

  <link rel="stylesheet" href="style.css?v=2026-05-05d" />
</head>
<body>
  <header class="topbar">
    <div class="topbarHeader">
      <div class="titleRow">
        <h1 id="pageTitle">Carte des projets en cours du BIMO</h1>

        <div class="titleStats" aria-live="polite">
          <span id="statCount">0</span> projet(s)
          <span id="statDept" class="statDept"></span>
        </div>

        <label class="search search--header">
          <span class="sr-only">Recherche</span>
          <input id="q" type="search" placeholder="Rechercher (nom, ville, client, thématique…)" autocomplete="off" />
        </label>
      </div>
    </div>

    <div id="toolbar" class="toolbar" role="region" aria-label="Filtres">
      <fieldset class="types" aria-label="Type de projet">
        <label><input class="typeFilter" type="checkbox" value="MOM" checked /> MOM</label>
        <label><input class="typeFilter" type="checkbox" value="AMO" checked /> AMO</label>
        <label><input class="typeFilter" type="checkbox" value="EXP" checked /> EXP</label>
      </fieldset>

      <button id="clear" type="button">Réinitialiser</button>
      <button id="antennaSummaryBtn" type="button" aria-pressed="false" aria-controls="antennaSummaryOverlay">Synthèse</button>
      <button id="projListBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="projListMenu">Liste projets</button>

      <button id="advancedFiltersBtn" type="button" aria-expanded="false" aria-controls="advancedFiltersPanel">Filtres avancés</button>

      <div id="projectModeSwitch" class="projectModeSwitch" role="group" aria-label="Afficher les projets en cours ou les projets finis">
        <button id="currentProjectsBtn" class="projectModeBtn is-active" type="button" data-project-mode="current" aria-pressed="true">En cours</button>
        <button id="completedProjectsBtn" class="projectModeBtn" type="button" data-project-mode="completed" aria-pressed="false">Finis</button>
      </div>


      <div id="advancedFiltersPanel" class="advancedFiltersPanel" hidden role="region" aria-label="Filtres avancés">
        <div class="advancedFiltersGrid">
          <label>Montant min.
            <input id="amountMin" type="number" min="0" step="1000" inputmode="numeric" placeholder="Ex. 1000000" />
          </label>
          <label>Montant max.
            <input id="amountMax" type="number" min="0" step="1000" inputmode="numeric" placeholder="Ex. 5000000" />
          </label>
          <label>Phase
            <select id="phaseFilter"><option value="">Toutes</option></select>
          </label>
          <label>Client
            <select id="clientFilter"><option value="">Tous</option></select>
          </label>
          <label>Programme
            <select id="programmeFilter"><option value="">Tous</option></select>
          </label>
          <label>Thématique
            <select id="themeFilter"><option value="">Toutes</option></select>
          </label>
          <label>Département
            <select id="deptFilter"><option value="">Tous</option></select>
          </label>
          <label>Photos
            <select id="photosFilter">
              <option value="">Tous</option>
              <option value="yes">Avec photos</option>
              <option value="no">Sans photos</option>
            </select>
          </label>
          <label>Données énergie
            <select id="energyFilter">
              <option value="">Tous</option>
              <option value="yes">Avec données énergie</option>
              <option value="no">Sans données énergie</option>
            </select>
          </label>
        </div>
      </div>

      <div id="projListMenu" class="projListMenu" hidden role="region" aria-label="Liste des projets">
        <div class="projListTop">
          <input id="projListSearch" class="projListSearch" type="text" placeholder="Rechercher un projet…" autocomplete="off" aria-label="Rechercher dans la liste des projets" />
          <select id="projListSort" class="projListSort" aria-label="Trier la liste">
            <option value="name_asc" selected>Nom (A → Z)</option>
            <option value="name_desc">Nom (Z → A)</option>
            <option value="amount_desc">Montant (↓)</option>
            <option value="amount_asc">Montant (↑)</option>
            <option value="type_asc">Type (A → Z)</option>
            <option value="antenna_asc">Antenne (A → Z)</option>
          </select>
        </div>

        <div class="projListHead">
          <span>Nom</span><span>Type</span><span>Montant</span><span>Antenne</span>
        </div>

        <div id="projListItems" class="projListItems"></div>
      </div>

      <div class="brand" aria-label="Ministères économiques et financiers">
        <img class="brandLogo" src="assets/logo-ministere.png" alt="Ministères économiques et financiers – Secrétariat général" />
      </div>
    </div>
  </header>

  <main id="layout" class="layout">
    <div id="map" class="map" aria-label="Carte des projets du BIMO"></div>
    <aside id="panel" class="panel" aria-label="Détails du projet"></aside>
    <div id="antennaSummaryOverlay" class="antennaSummaryOverlay" aria-live="polite" hidden></div>

    <div id="legend" class="legend" aria-label="Légende antennes" hidden>
      <div class="legend-title">Antenne (départements)</div>
      <div id="legendAntennas"></div>
      <div class="legend-sep" role="separator" aria-hidden="true"></div>
      <div class="legend-subtitle">Type de projet (pins)</div>
      <div class="legend-row"><span class="pin-swatch" style="border-color:red;"></span><span>AMO</span></div>
      <div class="legend-row"><span class="pin-swatch" style="border-color:blue;"></span><span>MOM</span></div>
      <div class="legend-row"><span class="pin-swatch" style="border-color:green;"></span><span>EXP</span></div>
      <div class="legend-row"><span class="pin-swatch" style="border-color:orange;"></span><span>Autres</span></div>
    </div>

    <div id="status" class="status" aria-live="polite" hidden></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin="anonymous"></script>
  <script src="script.js?v=2026-05-05d"></script>
</body>
</html>
